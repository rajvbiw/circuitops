apiVersion: v1
kind: ConfigMap
metadata:
  name: circuitops-config
  namespace: circuitops
  labels:
    app.kubernetes.io/name: circuitops-marketplace
    app.kubernetes.io/component: config
data:
  PORT: "5000"
  NODE_ENV: "production"
  JWT_EXPIRES_IN: "7d"

  DB_HOST: "circuitops-mysql-svc"
  DB_PORT: "3306"
  DB_USER: "root"
  DB_NAME: "circuitops_db"

  AI_PROVIDER: "mock"
  OLLAMA_BASE_URL: "http://localhost:11434"

  VITE_API_URL: "http://circuitops-backend-svc:5000/api/v1"
