apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: circuitops-backend-hpa
  namespace: circuitops
  labels:
    app.kubernetes.io/name: circuitops-marketplace
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: circuitops-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60    
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70    
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60    
      policies:
        - type: Pods
          value: 2                     
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 180   
      policies:
        - type: Pods
          value: 1                      
          periodSeconds: 120

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: circuitops-frontend-hpa
  namespace: circuitops
  labels:
    app.kubernetes.io/name: circuitops-marketplace
    app.kubernetes.io/component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: circuitops-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
