services:
  mysql:
    image: mysql:8.0
    container_name: circuitops-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=Test@123
      - MYSQL_DATABASE=circuitops_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Automatically initialize database tables & mock data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - circuitops-nw 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pTest@123"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    build: ./backend
    container_name: circuitops-backend
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=Test@123
      - DB_NAME=circuitops_db
      - PORT=5000
      - AI_PROVIDER=mock
    ports:
      - "5001:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - circuitops-nw 

  circuitops:
    build: ./frontend
    container_name: circuitops-frontend
    environment:
      - VITE_API_URL=http://localhost:5001/api/v1
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    networks:
      - circuitops-nw

networks:
  circuitops-nw:
    driver: bridge

volumes:
  mysql_data: